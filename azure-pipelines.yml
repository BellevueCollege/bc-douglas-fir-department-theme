trigger:
  branches:
    include:
      - trunk
  tags:
    include:
      - 'v*'
  paths:
    exclude:
      - azure-pipelines.yml
      - azure-pipelines-release.yml

pr:
  branches:
    include:
      - trunk
      - release-v*
      - hotfix-v*

resources:
  repositories:
    - repository: templates
      type: github
      name: BellevueCollege/bc-wordpress-devops-templates
      endpoint: github-service-connection

extends:
  template: templates/ci/theme-ci.yml@templates
  parameters:

    themeName: 'bc-douglas-fir-department-theme'
    runComposer: false

    testEnvironments:
      - name: KinstaCstage
        displayName: 'Kinsta: CStage'
        environment: kinsta-cstage
        sshServiceConnection: cstage
        variableGroup: kinsta-cstage

    buildSteps:
      - task: replacetokens@6
        inputs:
          rootDirectory: 'sass'
          targetFiles: 'style.scss'
          encoding: 'auto'
          writeBOM: true
          actionOnMissing: 'warn'
          keepToken: false
          tokenPrefix: '#{'
          tokenSuffix: '}#'
        displayName: 'Inject Version into sass/style.scss'

      - task: Npm@1
        inputs:
          command: 'custom'
          customCommand: 'run build:dev'
        displayName: 'NPM Build (dev)'
        condition: and(succeeded(), not(or(eq(variables['Build.SourceBranch'], 'refs/heads/trunk'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))))

      - task: Npm@1
        inputs:
          command: 'custom'
          customCommand: 'run build'
        displayName: 'NPM Build (prod)'
        condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/trunk'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v')))
